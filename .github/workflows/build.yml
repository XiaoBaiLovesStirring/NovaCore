name: Build NovaCore 2.0 Mixin

on:
  push:
    branches: [ main, mixin-refactor ]
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          wget -q https://raw.githubusercontent.com/gradle/gradle/v4.9.0/gradle/wrapper/gradle-wrapper.jar
          cd ../..
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          SAVED="$(pwd)"
          cd "$(dirname "$0")"
          APP_HOME="$(pwd -P)"
          cd "$SAVED"
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: Build NovaCore Mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build Agent JAR
        run: ./gradlew buildAgentJar --no-daemon --stacktrace

      - name: Upload NovaCore Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Mod
          path: build/libs/NovaCore-*.jar
          retention-days: 30

      - name: Upload NovaCore Agent JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Agent
          path: build/libs/NovaCoreAgent-*.jar
          retention-days: 30

      - name: Show build result
        run: |
          echo "=== Build completed ==="
          ls -lh build/libs/

  build-native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build Native Library (Linux .so)
        run: |
          cd native
          chmod +x build.sh
          bash build.sh

      - name: Upload Native Linux .so
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Native-Linux
          path: native/libnovacore_native.so
          retention-days: 30

  release:
    needs: [build-mod, build-native-linux]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/mixin-refactor'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NovaCore 2.0 Mixin - Build ${{ github.run_number }}"
          tag_name: "v2.0-mixin-build-${{ github.run_number }}"
          body: |
            ## NovaCore 2.0 Mixin 版本

            ### 构建信息
            - 提交: ${{ github.sha }}
            - 构建号: ${{ github.run_number }}
            - 分支: mixin-refactor

            ### 包含文件
            - **NovaCore-Mod**: Mixin 注入模组 (放入 mods/)
            - **NovaCore-Agent**: Java Agent JVM 优化 (配合 -javaagent 使用)
            - **NovaCore-Native-Linux**: 原生库 (配合 Agent 使用)

            ### 启动参数
            ```
            java \
              -javaagent:NovaCoreAgent-1.0.0-agent.jar=gcThreads=4;maxPauseMillis=50 \
              -XX:+UseG1GC -XX:+UseNUMA -XX:+AlwaysPreTouch \
              -Dfml.coreMods.load=com.novacore.NovaCorePlugin \
              -jar forge-1.12.2-14.23.5.2864-universal.jar \
              --tweakClass org.spongepowered.asm.launch.MixinTweaker
            ```
          files: |
            release-artifacts/NovaCore-Mod/*.jar
            release-artifacts/NovaCore-Agent/*.jar
            release-artifacts/NovaCore-Native-Linux/*.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}