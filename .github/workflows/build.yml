name: Build NovaCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle & Forge userdev
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/forge_userdev
          key: ${{ runner.os }}-gradle-novacore-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-novacore-

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload NovaCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore
          path: build/libs/*.jar
          retention-days: 7

      - name: Show build result
        run: |
          echo "=== Build completed ==="
          ls -lh build/libs/