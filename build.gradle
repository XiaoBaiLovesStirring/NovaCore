plugins {
    id 'java'
}

version = '1.0.0-alpha'
group = 'com.novacore'
archivesBaseName = 'NovaCore'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

// ===== Forge 1.12.2 userdev (deobfuscated Minecraft + Forge, compile only) =====
configurations {
    forge
    compileOnly.extendsFrom forge
}

def userdevVersion = '1.12.2-14.23.5.2864'
def userdevDir = file("$buildDir/forge_userdev")
def userdevJar = file("$userdevDir/forge-${userdevVersion}-userdev.jar")

dependencies {
    forge files(userdevJar)
}

task downloadForgeUserdev {
    doLast {
        userdevDir.mkdirs()
        if (!userdevJar.exists()) {
            def url = "https://files.minecraftforge.net/maven/net/minecraftforge/forge/${userdevVersion}/forge-${userdevVersion}-userdev.jar"
            println "[NovaCore] Downloading Forge userdev from: $url"
            new URL(url).withInputStream { input ->
                userdevJar.withOutputStream { output ->
                    output << input
                }
            }
            println "[NovaCore] Downloaded: ${userdevJar.length()} bytes"
        } else {
            println "[NovaCore] Using cached Forge userdev: ${userdevJar.length()} bytes"
        }
    }
}

compileJava.dependsOn downloadForgeUserdev

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.novacore.NovaCorePlugin',
            'FMLCorePluginContainsFMLMod': 'false',
            'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}