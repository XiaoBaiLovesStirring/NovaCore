plugins {
    id 'java'
}

version = '1.0.0-alpha'
group = 'com.novacore'
archivesBaseName = 'NovaCore'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

// ===== Forge 1.12.2 universal jar (SRG=class names match MCP, compile only) =====
configurations {
    forge
    compileOnly.extendsFrom forge
}

def userdevVersion = '1.12.2-14.23.5.2864'
def userdevDir = file("$buildDir/forge_universal")
def userdevJar = file("$userdevDir/forge-${userdevVersion}-universal.jar")

dependencies {
    forge files(userdevJar)
}

task downloadForgeUniversal {
    doLast {
        userdevDir.mkdirs()
        if (!userdevJar.exists() || userdevJar.length() < 1000000) {
            def url = "https://maven.minecraftforge.net/net/minecraftforge/forge/${userdevVersion}/forge-${userdevVersion}-universal.jar"
            println "[NovaCore] Downloading Forge universal from: $url"
            exec {
                commandLine 'curl', '-L', '-o', userdevJar.absolutePath, url
            }
            println "[NovaCore] Downloaded: ${userdevJar.length()} bytes"
        } else {
            println "[NovaCore] Using cached Forge universal: ${userdevJar.length()} bytes"
        }
    }
}

compileJava.dependsOn downloadForgeUniversal

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.novacore.NovaCorePlugin',
            'FMLCorePluginContainsFMLMod': 'false',
            'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}