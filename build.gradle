plugins {
    id 'java'
}

version = '1.0.0-alpha'
group = 'com.novacore'
archivesBaseName = 'NovaCore'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
}

// ===== Forge 1.12.2 universal jar (SRG class names = MCP, compile only) =====
configurations {
    forge
    compileOnly.extendsFrom forge
}

def forgeVersion = '1.12.2-14.23.5.2864'
def forgeDir = file("$buildDir/forge_universal")
def forgeJar = file("$forgeDir/forge-${forgeVersion}-universal.jar")

dependencies {
    forge files(forgeJar)
    // ASM 字节码库 (coremod 核心依赖，运行时由 Forge 提供)
    compileOnly 'org.ow2.asm:asm:5.2'
    compileOnly 'org.ow2.asm:asm-commons:5.2'
    // LaunchWrapper (coremod 加载框架)
    compileOnly 'net.minecraft:launchwrapper:1.12'
}

task downloadForgeUniversal {
    doLast {
        forgeDir.mkdirs()
        if (!forgeJar.exists() || forgeJar.length() < 1000000) {
            def url = "https://maven.minecraftforge.net/net/minecraftforge/forge/${forgeVersion}/forge-${forgeVersion}-universal.jar"
            println "[NovaCore] Downloading Forge universal from: $url"
            exec {
                commandLine 'curl', '-L', '-o', forgeJar.absolutePath, url
            }
            println "[NovaCore] Downloaded: ${forgeJar.length()} bytes"
        } else {
            println "[NovaCore] Using cached Forge universal: ${forgeJar.length()} bytes"
        }
    }
}

compileJava.dependsOn downloadForgeUniversal

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.novacore.NovaCorePlugin',
            'FMLCorePluginContainsFMLMod': 'false',
            'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}