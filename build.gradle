plugins {
    id 'java'
}

version = '1.0.0-alpha'
group = 'com.novacore'
archivesBaseName = 'NovaCore'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
}

// ===== Forge 1.12.2 userdev (deobfuscated Minecraft + Forge, compile only) =====
configurations {
    forge
    compileOnly.extendsFrom forge
}

def forgeVersion = '1.12.2-14.23.5.2864'
def forgeDir = file("$buildDir/forge_userdev")
def forgeJar = file("$forgeDir/forge-${forgeVersion}-userdev.jar")

dependencies {
    forge files(forgeJar)
    // ASM 字节码库 (coremod 核心依赖，运行时由 Forge 提供)
    compileOnly 'org.ow2.asm:asm:5.2'
    compileOnly 'org.ow2.asm:asm-commons:5.2'
    // LaunchWrapper (coremod 加载框架)
    compileOnly 'net.minecraft:launchwrapper:1.12'
}

task downloadForgeUserdev {
    doLast {
        forgeDir.mkdirs()
        if (!forgeJar.exists() || forgeJar.length() < 1000000) {
            // files.minecraftforge.net 首响应即 200 OK，不加 -L 避免重定向到 maven.minecraftforge.net
            def url = "https://files.minecraftforge.net/maven/net/minecraftforge/forge/${forgeVersion}/forge-${forgeVersion}-userdev.jar"
            println "[NovaCore] Downloading Forge userdev from: $url"
            exec {
                commandLine 'curl', '--max-redirs', '0', '-o', forgeJar.absolutePath, url
            }
            // 如果文件太小（HTML错误页），尝试带重定向的备选方案
            if (forgeJar.length() < 1000000) {
                println "[NovaCore] Direct download failed (${forgeJar.length()} bytes), trying with redirect..."
                exec {
                    commandLine 'curl', '-L', '-o', forgeJar.absolutePath, url
                }
            }
            println "[NovaCore] Downloaded: ${forgeJar.length()} bytes"
        } else {
            println "[NovaCore] Using cached Forge userdev: ${forgeJar.length()} bytes"
        }
    }
}

compileJava.dependsOn downloadForgeUserdev

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'com.novacore.NovaCorePlugin',
            'FMLCorePluginContainsFMLMod': 'false',
            'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}