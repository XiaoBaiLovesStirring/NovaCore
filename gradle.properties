# Gradle Properties
org.gradle.jvmargs = -Xmx3G
# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false
# Testing
enable_junit_testing = false
show_testing_output = false
# Shadow
enable_shadow = false
# Set this to true if you want to use old LWJGL2 methods.
enable_lwjglx = true
# Mod Information
mod_version = 1.2.1
root_package = com.novacore
mod_id = novacore
mod_name = NovaCore
# Mod Metadata (Optional)
mod_description = Minecraft 1.12.2 ultimate performance overhaul for Cleanroom\xE2\x80\x94 ASM-based BFS lighting, async chunk preloading with LRU cache, memory leak fixes, triple-tier entity culling, and OpenGL state deduplication.
mod_url =
mod_update_json =
mod_authors = NovaCore Team
mod_credits = Inspired by Starlight, Pulsar, Sodium, EntityCulling, FoamFix, BetterFPS. Built for Cleanroom.
mod_logo_path =
# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false
# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = NovaCore
maven_url =
# ----------------------------------------------------------------------------------------------------------------------
# Access Transformers
use_access_transformer = true
# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.novacore.NovaCorePlugin
# AssetMover
use_asset_mover = false
asset_mover_version = 2.5